[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxshield"
version = "0.1.0"
description = "Multimodal Voice Scam Detection & Risk Analysis Framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Audio Scam Detection Research Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "transformers>=4.44.0",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.0",
    "streamlit>=1.38.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0"
]

[tool.setuptools.packages.find]
where = ["src"]
